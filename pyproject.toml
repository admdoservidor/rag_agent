[project]
name = "ragda"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "admdoservidor", email = "lucassimoes0516@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.41",
    "langchain>=1.5.2",
    "langchain-chroma>=1.2.0",
    "langchain-core>=1.8.4",
    "langchain-groq>=1.2.1",
    "langchain-huggingface>=1.3.0",
    "langchain-text-splitters>=1.2.0",
    "numpy>=2.4.6",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
ragda = "ragda:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
